name: Check Markdown
description: Runs markdownlint over the md files

inputs:
  targetMdFiles:
    description: globs that target the required md files to lint
    required: false
    default: '"**/*.md" "!**/node_modules/**" "!LICENSE.md" "!**/__examples__/**" "!**/_site/**" "!.github/**" "!**/*.verified.md" "!**/*.ipynb.md"'

runs:
  using: composite
  steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: latest
    - name: Run Markdownlint
      shell: bash
      run: |
        # repos without a package.json have no local dev dependencies; npx
        # fetches markdownlint-cli2 on demand in that case.
        # __examples__, _site and *.verified.md are generated output, and
        # .github holds issue templates - none of it is documentation to lint.
        if [ -f package.json ]; then
          npm i
        fi
        npx markdownlint-cli2 ${{ inputs.targetMdFiles }}
    - name: Check table structure
      shell: bash
      run: |
        # markdownlint does not parse tables, so a header split over several
        # lines - which docfx renders as a plain paragraph - passes lint and
        # ships. This checks that every table has a delimiter row as its second
        # row and that all of its rows have the same number of cells.
        python3 "$GITHUB_ACTION_PATH/check-tables.py" ${{ inputs.targetMdFiles }}
