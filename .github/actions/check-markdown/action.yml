name: Check Markdown
description: Runs markdownlint over the md files

inputs:
  targetMdFiles:
    description: globs that target the required md files to lint
    required: false
    default: '"**/*.md" "!node_modules/**" "!LICENSE.md" "!**/__examples__/**" "!**/_site/**"'

runs:
  using: composite
  steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: latest
    - name: Run Markdownlint
      shell: bash
      run: |
        # repos without a package.json have no local dev dependencies; npx
        # fetches markdownlint-cli2 on demand in that case.
        # __examples__ and _site are generated output, not prose to lint.
        if [ -f package.json ]; then
          npm i
        fi
        npx markdownlint-cli2 ${{ inputs.targetMdFiles }}
