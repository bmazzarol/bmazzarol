name: Check Docs
description: Checks the Docfx site

inputs:
  docsProjectPath:
    required: true
    description:
      Path to the docs project in the repository, eg. src/Docs/MyProject
  csProjFileName:
    required: true
    description:
      Name of the csproj file including extension, eg. MyProject.csproj
  dotnetVersion:
    required: false
    default: '11.0.x'
    description:
      .NET SDK channel to install, eg. 11.0.x

runs:
  using: composite
  steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ inputs.dotnetVersion || '11.0.x' }}
    - name: Docs project check
      shell: bash
      run: |
        if [ -z "${{ inputs.docsProjectPath }}" ]; then
          echo "::warning::DOCS_PROJECT_PATH / CS_PROJ_FILE_NAME are unavailable (fork pull requests cannot read repository variables) - skipping the docs check."
        fi
    - name: Build
      if: ${{ inputs.docsProjectPath != '' }}
      shell: bash
      run: |
        dotnet build --configuration Release ${{ inputs.docsProjectPath }}/${{inputs.csProjFileName }}
