name: CI Sync

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      # A PAT (or fine-grained token) with "Secrets: Read & Write" on every
      # target repo. GITHUB_TOKEN from this repo cannot write secrets into the
      # sibling repos, so without it this job is a no-op.
      GH_TOKEN: ${{ secrets.CI_SYNC_TOKEN }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Preflight
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "::warning::CI_SYNC_TOKEN is not set on bmazzarol/bmazzarol; scheduled sync is skipped."
            echo "Create a fine-grained PAT with 'Secrets: Read & Write' on the project repos and store it as CI_SYNC_TOKEN."
            echo "Also store SONAR_TOKEN (and NUGET_API_KEY) as repository secrets so they can be propagated."
          fi

      - name: Push secrets out to every repo
        if: ${{ env.GH_TOKEN != '' }}
        run: ./scripts/ci-sync.sh sync

      - name: Push per-repo settings as repo variables
        if: ${{ env.GH_TOKEN != '' }}
        run: ./scripts/ci-sync.sh settings

      - name: Report drift
        if: ${{ env.GH_TOKEN != '' }}
        run: ./scripts/ci-sync.sh check
